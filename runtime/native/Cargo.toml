[package]
name = "lo-native-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"

[lib]
name = "lo_runtime"
crate-type = ["staticlib"]

[features]
metal = []

[dependencies]
num-bigint = "=0.4.6"
num-traits = "=0.2.19"
serde_json = "=1.0.140"
base64 = "=0.22.1"

rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "=0.8.4"
ring = "=0.17.14"
libc = "=0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"

[profile.release]
panic = "abort"
opt-level = 0
lto = false
codegen-units = 1

[profile.dev]
panic = "abort"
